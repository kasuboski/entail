[tools]
"rust" = { version = "1.98.0", profile = "default" }
"cargo:cargo-nextest" = "0.9.117"

[tasks.format]
description = "Check Rust formatting"
run = "nix develop --command cargo fmt --all --check"

[tasks.lint]
description = "Run Clippy with all targets and features"
run = "nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the native Rust test suite"
run = "nix develop --command cargo nextest run --workspace --all-features --no-tests=pass"

[tasks.msrv]
description = "Check all targets with the declared minimum Rust version"
run = "mise x rust@1.85.0 -- nix develop --command cargo check --workspace --all-targets --all-features --locked"

[tasks.check]
description = "Run formatting, lint, MSRV, and tests"
depends = ["format", "lint", "msrv", "test"]
