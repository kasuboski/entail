[tools]
"rust" = { version = "1.98.0", profile = "default" }
"cargo:cargo-nextest" = "0.9.117"

[tasks.format]
description = "Check Rust formatting"
run = "nix-shell shell.nix --run 'cargo fmt --all --check'"

[tasks.lint]
description = "Run Clippy with all targets and features"
run = "nix-shell shell.nix --run 'cargo clippy --all-targets --all-features -- -D warnings'"

[tasks.test]
description = "Run the native Rust test suite"
run = "nix-shell shell.nix --run 'cargo nextest run --all-features --no-tests=pass'"

[tasks.msrv]
description = "Check all targets with the declared minimum Rust version"
run = "mise x rust@1.85.0 -- nix-shell shell.nix --run 'cargo check --all-targets --all-features'"

[tasks.check]
description = "Run formatting, lint, MSRV, and tests"
depends = ["format", "lint", "msrv", "test"]
